<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botão</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 4rem;
    }
    button {
      font-size: 1.5rem;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
    }
    #mensagem {
      font-size: 3rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>Clique no botão</h1>
  <button id="botao">Botão</button>
  <p id="mensagem"></p>

  <script>
    document.getElementById('botao').addEventListener('click', function () {
      document.getElementById('mensagem').textContent = 'Eu amo vocês de montão s2';
    });
  </script>
</body>
</html>
